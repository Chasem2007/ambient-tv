<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Ambient</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <!-- Samsung TV platform APIs (only resolves on the TV; harmless 404 in a desktop browser) -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
  <div id="stage">
    <div class="layer" id="layerA"></div>
    <div class="layer" id="layerB"></div>
  </div>
  <div id="dim"></div>

  <div id="idle-clock"><div class="analog idle-analog"></div><div class="idle-text"></div></div>
  <div id="toast"></div>

  <div id="overlay">
    <div class="scrim scrim-top"></div>
    <div class="scrim scrim-left"></div>
    <div class="scrim scrim-bottom"></div>

    <section class="time">
      <div class="analog main-analog"></div>
      <div class="time-text">
        <div id="date"></div>
        <div id="clock"><span id="clock-hm"></span><span id="clock-ampm"></span></div>
        <div id="weather"></div>
      </div>
    </section>

    <section class="side">
      <div class="card glass" id="agenda">
        <div class="card-title">Up Next</div>
        <div id="agenda-list"></div>
      </div>
      <div class="card glass" id="sports">
        <div class="card-title">Scores</div>
        <div id="sports-list"></div>
      </div>
    </section>

    <nav class="dock" id="dock"></nav>
  </div>

  <div id="settings" class="glass">
    <div class="settings-title">Settings</div>
    <div id="settings-rows"></div>
  </div>

  <script src="js/private.js"></script>
  <script src="js/config.js"></script>
  <script src="js/backgrounds.js"></script>
  <script src="js/art.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/sports.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
